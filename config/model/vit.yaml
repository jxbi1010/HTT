# Vision Transformer (ViT) configuration for gelsight video data processing
# Uses ViT encoder for spatial feature extraction and temporal modeling

# Model type: 'vit_gelsight'
type: 'vit'

# Sensor-specific number of frames (matches image_chunk_size from data config)
9dtact_num_frames: 2  # For xela_9dtact dataset (matches image_chunk_size: 2)
gsmini_num_frames: 2   # For tacniq_gsmini dataset (samples 2 from 5 available, matches image_chunk_size: 2)
# ViT specific configuration
tubelet_size: 2  # Temporal dimension for video patches (tubelets)

# Backbone — bumped to depth 9, hidden 256 for SPL (2026-05-22).
# - num_layers=9 matches the 9-layer shared trunk in the pretrained probe pipeline
#   (3-layer per-modality encoder + 9-layer trunk = 12 effective layers; SPL's
#   monolithic 9 is the closest fair single-stack baseline).
# - hidden_dim=256 widens from 192 for added SPL capacity.
# - num_heads=4 so embed_dim is divisible (256 / 4 = 64 dim/head, same head_dim
#   as the pretrained 192/3 = 64).
# - model_size must be 'custom' here, otherwise vit_tiny hardcodes embed=192/heads=3.
num_layers: 9
num_heads: 4
hidden_dim: 256
model_size: 'custom'  # Options: 'tiny(192,3)', 'small(384,6)', 'base(768,12)', 'large(1024,16)', or 'custom'
mlp_ratio: 4.0  # MLP ratio: MLP hidden dimension = embed_dim * mlp_ratio (default: 4.0)

# Classifier (MLP head) — matched to utils/task_handlers.create_probe_head, which
# builds MLPHead(embed_dim, num_classes, dropout=0.1) with MLPHead's default
# hidden_dim=256. Same alignment we applied to taxel_tf.yaml.
classifier:
  hidden_dim: 256
  dropout: 0.1


decoder:
  decoder_depth: 3        # Number of transformer layers in decoder
  decoder_num_heads: 3    # Number of attention heads in decoder