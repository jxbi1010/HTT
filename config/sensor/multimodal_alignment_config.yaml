# Multimodal alignment configuration (paired xela + 9dtact data)
data:
  dataset_type: "xela_9dtact"
  training_type: "multimodal"
  data_root: "HTT-dataset"  # dataset root; loaders resolve pretrain/ or classification/ subdirs (see data/dataset_paths.py)

  batch_size: 64
  num_workers: 4
  pin_memory: true
  persistent_workers: true

  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  random_seed: 42
  train_data_percentage: 1.0

  image_chunk_size: 2
  tactile_chunk_size: 20
  chunk_selection_mode: "sliding"
  overlap_step: 1

  apply_background_subtraction: true
  normalize_images: true
  normalize_tactile: true
  apply_fft: false
  skip_validation: true
